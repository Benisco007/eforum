name: eforum
description: Réseau social communautaire dédié à eFootball
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Gestion d'état
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  timeago: ^3.7.0
  flutter_svg: ^2.0.10+1

  # Utilitaires
  uuid: ^4.5.0
  intl: ^0.19.0
  crypto: ^3.0.5 # Pour le hash du conversationId
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_local_notifications: ^18.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

shared_preferences: ^2.3.2
supabase_flutter: ^2.5.0
onesignal_flutter: ^5.2.5
